spring.application.name=backend
spring.config.import=optional:classpath:application-local.properties

# Defaults match docker-compose.yml (postgres on host port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google Gemini API configuration (via OpenAI-compatible API)
# Get your Gemini API Key from Google AI Studio: https://aistudio.google.com/
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}
spring.ai.openai.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.openai.embedding.options.dimensions=768
spring.ai.openai.embedding.dimensions=768

# PgVector (dimensions: 768 for gemini-embedding-001)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Github OAuth2 configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.port=${PORT:8080}
server.forward-headers-strategy=framework

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.max-age=7d
server.servlet.session.timeout=7d

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
